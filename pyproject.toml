[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnevma-edge-omega"
version = "0.2.0"
description = "Research platform for reflective multi-agent AI and safe evolution experiments"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "httpx>=0.27,<1",
  "networkx>=3.2,<4",
  "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.1,<4",
  "redis>=5,<7"
]

[project.optional-dependencies]
vectors = ["pgvector>=0.3,<1", "faiss-cpu>=1.8,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
