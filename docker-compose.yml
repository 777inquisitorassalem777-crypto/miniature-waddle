services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pnevma:pnevma@postgres:5432/pnevma
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: local
      SANDBOX_EXECUTION: "false"
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pnevma
      POSTGRES_USER: pnevma
      POSTGRES_PASSWORD: pnevma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
